apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

apply from: project(':common').projectDir.absolutePath + '/variables.gradle'


buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.5'
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.google.com'
    }
}

android {
    namespace 'com.abrenoch.hyperiongrabber.tv'
    compileSdk 30
    defaultConfig {
        applicationId "com.abrenoch.hyperiongrabber"
        minSdkVersion 26
        targetSdkVersion 30
        versionCode 2013
        versionName "1.1 BETA 1"
    }
    // [deepseek] Release signing config. The keystore lives in <repo>/keystore and is NOT
    // [deepseek] committed (see .gitignore), so a fresh clone still builds an unsigned APK.
    signingConfigs {
        release {
            storeFile file("../keystore/hyperion-release.jks")
            storePassword "hyperion2026"
            keyAlias "hyperion"
            keyPassword "hyperion2026"
        }
    }
    buildTypes {
        release {
            // [deepseek] Sign the release build so the APK can be installed on the TV.
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    // [deepseek] The app targets API 30 on purpose (TV hardware / media projection, not a Play
    // [deepseek] Store release). Skip the fatal "ExpiredTargetSdkVersion" check on release builds
    // [deepseek] so lintVitalRelease does not abort assembleRelease. Full lint still runs on demand.
    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(path: ':common')

    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation "androidx.appcompat:appcompat:1.0.0"
    implementation "androidx.leanback:leanback:1.0.0"
    implementation "androidx.leanback:leanback-preference:1.0.0"
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    implementation 'nl.dionsegijn:konfetti:1.3.2'
    // required for konfetti
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

}

// [deepseek] ButterKnife's annotation processor (10.2.3) reaches into com.sun.tools.javac, which
// [deepseek] JDK 16+ encapsulates via the module system. Export the packages the processor needs
// [deepseek] to the unnamed module so it runs on the JDK 17 toolchain used for the build.
// [deepseek] The Android JavaCompile task runs javac in a forked worker process, so the exports
// [deepseek] have to be passed as JVM arguments of the forked process, not as compiler args.
tasks.withType(JavaCompile).configureEach {
    def exports = [
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
        '--add-exports', 'jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED'
    ]
    options.fork = true
    options.forkOptions.jvmArgs += exports
}

